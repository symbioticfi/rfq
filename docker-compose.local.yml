services:
  postgres:
    image: postgres:17
    container_name: rfq-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfq_protocol
    ports:
      - "55432:5432"
    volumes:
      - rfq_local_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  rfq_local_postgres:
